---
# ─────────────────────────────────────────────────────────────
#  Nestor — Client Node Onboarding Playbook
# ─────────────────────────────────────────────────────────────
#  Run against a freshly-provisioned client node to:
#   1. Install node_exporter
#   2. Install Grafana Alloy (log shipper to central Loki)
#   3. Install DCGM exporter (GPU nodes)
#   4. Install ibstat_exporter (InfiniBand nodes)
#   5. Tighten UFW so only the central monitor can scrape
#   6. Register the host as a Prometheus target on the central host
#
#  The central monitoring host is fixed (one per fleet) and is
#  NOT redeployed by this playbook. It is referenced via the
#  `monitor_server` group for target registration only.
#
#  Usage:
#    ansible-playbook -i inventory.yml onboard.yml --limit <hostname>
#    ansible-playbook -i inventory.yml onboard.yml --tags dcgm,verify
# ─────────────────────────────────────────────────────────────

- name: Onboard client node into Nestor monitoring fleet
  hosts: gpu_nodes:training_nodes
  become: true
  gather_facts: true

  pre_tasks:
    - name: Sanity — required inventory vars are set
      ansible.builtin.assert:
        that:
          - host_label    is defined and host_label    | length > 0
          - host_ip       is defined and host_ip       | length > 0
          - client_name   is defined and client_name   | length > 0
          - env           is defined and env           | length > 0
          - role          is defined and role          | length > 0
          - node_type     is defined and node_type     | length > 0
        fail_msg: |
          Missing required host vars. Every host in inventory.yml needs:
            host_label, host_ip, client_name, env, role, node_type
      tags: [always]

  roles:
    - role: node_exporter
      tags: [node_exporter]

    - role: alloy
      tags: [alloy, logs]

    - role: dcgm_exporter
      when: has_gpu | default(false) | bool
      tags: [dcgm]

    - role: ibstat_exporter
      when: has_infiniband | default(false) | bool
      tags: [ibstat]

    - role: ufw_scrape_ports
      tags: [ufw, firewall]

    - role: prometheus_target_register
      tags: [register]

  post_tasks:
    - name: Done — onboarding summary
      ansible.builtin.debug:
        msg: |
          ✓ {{ host_label }} ({{ host_ip }}) onboarded for client '{{ client_name }}'.
          Exporters: node{% if has_gpu | default(false) %}, dcgm{% endif %}{% if has_infiniband | default(false) %}, ibstat{% endif %}.
          Registered on central monitor — Prometheus reloaded.
      tags: [always]
