---
# ── NVIDIA DCGM exporter — install + run ──────────────────────
- name: dcgm — detect NVIDIA driver
  ansible.builtin.command:
    cmd: nvidia-smi --query-gpu=count --format=csv,noheader
  register: nv_check
  changed_when: false
  failed_when: false
  check_mode: false
  tags: [dcgm, preflight]

- name: dcgm — abort if no NVIDIA driver and strict mode
  ansible.builtin.fail:
    msg: |
      No NVIDIA driver detected on {{ inventory_hostname }}.
      Either install the NVIDIA driver before running this role,
      or set `dcgm_exporter_require_nvidia: false` to skip.
  when:
    - nv_check.rc != 0
    - dcgm_exporter_require_nvidia | bool
  tags: [dcgm, preflight]

- name: dcgm — skip install (no NVIDIA driver and non-strict)
  ansible.builtin.debug:
    msg: "Skipping dcgm-exporter — no NVIDIA driver on {{ inventory_hostname }}."
  when:
    - nv_check.rc != 0
    - not dcgm_exporter_require_nvidia | bool
  tags: [dcgm]

- name: dcgm — download .deb package
  ansible.builtin.get_url:
    url: "{{ dcgm_exporter_deb_url }}"
    dest: "/tmp/dcgm-exporter.deb"
    mode: '0644'
  when: nv_check.rc == 0
  tags: [dcgm, install]

- name: dcgm — install .deb package
  ansible.builtin.apt:
    deb: /tmp/dcgm-exporter.deb
    state: present
  when: nv_check.rc == 0
  notify: restart dcgm-exporter
  tags: [dcgm, install]

- name: dcgm — enable + start
  ansible.builtin.systemd:
    name: dcgm-exporter
    state: started
    enabled: true
    daemon_reload: true
  when: nv_check.rc == 0
  tags: [dcgm, service]

- name: dcgm — verify HTTP endpoint
  ansible.builtin.uri:
    url: "http://127.0.0.1:{{ dcgm_exporter_port }}/metrics"
    status_code: 200
    return_content: false
  retries: 5
  delay: 2
  register: dcgm_check
  until: dcgm_check.status == 200
  when: nv_check.rc == 0
  tags: [dcgm, verify]
