---
# ── UFW scrape allowlist ──────────────────────────────────────
- name: ufw — install
  ansible.builtin.apt:
    name: ufw
    state: present
    update_cache: true
    cache_valid_time: 3600
  tags: [ufw, install]

- name: ufw — allow SSH (port 22) before enabling
  community.general.ufw:
    rule: allow
    port: "22"
    proto: tcp
  tags: [ufw, rules]

- name: ufw — default policies
  community.general.ufw:
    direction: "{{ item.direction }}"
    policy: "{{ item.policy }}"
  loop:
    - { direction: incoming, policy: deny }
    - { direction: outgoing, policy: allow }
  tags: [ufw, rules]

- name: ufw — allow exporter ports from central monitor only
  community.general.ufw:
    rule: allow
    from_ip: "{{ ufw_scrape_source_ip }}"
    to_port: "{{ item.port }}"
    proto: "{{ item.proto }}"
    comment: "Nestor: {{ item.name }} from central"
  loop: "{{ ufw_scrape_ports }}"
  when: (item.when | default(true)) | bool
  tags: [ufw, rules]

- name: ufw — enable if inactive
  community.general.ufw:
    state: enabled
  when: ufw_enable_if_inactive | bool
  tags: [ufw, enable]
