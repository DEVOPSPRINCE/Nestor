---
# ── node_exporter — install + run as systemd unit ─────────────
- name: node_exporter — create system user
  ansible.builtin.user:
    name: "{{ node_exporter_user }}"
    system: true
    create_home: false
    shell: /usr/sbin/nologin
    state: present
  tags: [node_exporter, install]

- name: node_exporter — check installed version
  ansible.builtin.command:
    cmd: "{{ node_exporter_bin_path }} --version"
  register: ne_installed
  changed_when: false
  failed_when: false
  check_mode: false
  tags: [node_exporter, install]

- name: node_exporter — download binary
  ansible.builtin.unarchive:
    src: "{{ node_exporter_download_url }}"
    dest: /tmp/
    remote_src: true
    creates: "/tmp/node_exporter-{{ node_exporter_version }}.linux-amd64/node_exporter"
  when: node_exporter_version not in (ne_installed.stderr | default(''))
  tags: [node_exporter, install]

- name: node_exporter — install binary
  ansible.builtin.copy:
    src: "/tmp/node_exporter-{{ node_exporter_version }}.linux-amd64/node_exporter"
    dest: "{{ node_exporter_bin_path }}"
    mode: '0755'
    remote_src: true
  when: node_exporter_version not in (ne_installed.stderr | default(''))
  notify: restart node_exporter
  tags: [node_exporter, install]

- name: node_exporter — systemd unit
  ansible.builtin.template:
    src: node_exporter.service.j2
    dest: /etc/systemd/system/node_exporter.service
    owner: root
    group: root
    mode: '0644'
  notify: restart node_exporter
  tags: [node_exporter, config]

- name: node_exporter — enable + start
  ansible.builtin.systemd:
    name: node_exporter
    state: started
    enabled: true
    daemon_reload: true
  tags: [node_exporter, service]

- name: node_exporter — verify HTTP endpoint
  ansible.builtin.uri:
    url: "http://127.0.0.1:{{ node_exporter_port }}/metrics"
    status_code: 200
    return_content: false
  retries: 5
  delay: 2
  register: ne_check
  until: ne_check.status == 200
  tags: [node_exporter, verify]
